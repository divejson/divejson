name: CI

on:
  push:
    branches: [main]
  pull_request:

# The one place the implementation is pinned. This repository is the conformance
# suite and carries no implementation of its own: CI installs a released one from
# PyPI and asks it to run the corpus. Moving to a newer release is a one-line chore
# here, and it is a deliberate act - an unpinned install would let a release the
# maintainer has not looked at decide whether the corpus passes.
env:
  DIVEJSON_VERSION: "0.2.0"

jobs:
  # Named `conformance` since the repository's first workflow, and `trigger-site-deploy`
  # below depends on it by that name.
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # No matrix. What ran on two interpreters here was the implementation's own
      # test suite, which has moved to divejson/divejson-py along with the matrix
      # that covers it. What is left is a corpus, and a corpus does not vary by
      # interpreter.
      - name: Install the pinned implementation
        run: pip install "divejson==$DIVEJSON_VERSION"

      # `jsonschema` arrives as a dependency of the implementation. This is the one
      # check that is about the schema as a document rather than about what it
      # accepts: a schema with a typo in a keyword name validates everything and
      # would pass every fixture below.
      - name: Each schema is itself valid 2020-12
        run: |
          python - <<'EOF'
          import json, pathlib
          from jsonschema import Draft202012Validator

          schemas = sorted(pathlib.Path("schema").glob("*/divejson.schema.json"))
          if not schemas:
              raise SystemExit("no schema found under schema/*/divejson.schema.json")
          for path in schemas:
              with path.open() as handle:
                  Draft202012Validator.check_schema(json.load(handle))
              print(f"{path} OK")
          EOF

      # The whole suite in one command, which is the point of the split: `conform`
      # is the contract every implementation provides, so this line is what a port
      # in another language runs too. `--strict` turns a format the implementation
      # registers and the corpus has no pairs for into an error - without it the
      # suite could silently stop covering a reader.
      - name: The corpus passes against that implementation
        run: divejson conform fixtures/ --strict

  # A schema change only reaches its consumers once divejson.org serves it: every
  # schema's $id resolves there, so the site is the distribution channel rather
  # than a copy of one. This asks the site to rebuild as soon as the schema is
  # known good.
  #
  # `needs: conformance` is the whole point of triggering from here rather than
  # on push. The URL this publishes to is the one validators fetch, so a schema
  # that has not passed its own fixtures must never reach it.
  #
  # The site's weekly cron stays as the fallback for when this does not fire -
  # a revoked or uninstalled App fails silently, and without the cron the site
  # would simply stop tracking the spec with nothing to say so.
  trigger-site-deploy:
    needs: conformance
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      # A job-level `if` cannot read the secrets context, so the guard lives on
      # the steps instead: this job is inert until the App credentials exist,
      # which keeps it safe to merge before the App is created.
      APP_ID: ${{ secrets.SITE_DEPLOY_APP_ID }}
    steps:
      - if: env.APP_ID == ''
        run: echo "::notice::SITE_DEPLOY_APP_ID unset; skipping the divejson.org rebuild"
      - if: env.APP_ID != ''
        id: token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.SITE_DEPLOY_APP_ID }}
          private-key: ${{ secrets.SITE_DEPLOY_PRIVATE_KEY }}
          owner: divejson
          repositories: divejson.org
      - if: env.APP_ID != ''
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: gh workflow run deploy.yml --repo divejson/divejson.org --ref main
