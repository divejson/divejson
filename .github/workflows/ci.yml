name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  conformance:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The floor and a current version: pyproject declares >=3.10, and 3.10's
        # stricter datetime.fromisoformat is exactly the kind of thing only running
        # the floor catches.
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the validator
        run: pip install -e .
      - name: The schema is itself valid 2020-12
        run: |
          python - <<'EOF'
          import json
          from jsonschema import Draft202012Validator
          with open("schema/1.0/divejson.schema.json") as f:
              Draft202012Validator.check_schema(json.load(f))
          print("schema OK")
          EOF
      - name: Valid fixtures pass
        run: divejson validate fixtures/valid/*.divejson
      - name: Invalid fixtures fail
        run: |
          status=0
          for fixture in fixtures/invalid/*.divejson; do
            if divejson validate "$fixture" > /dev/null 2>&1; then
              echo "UNEXPECTED PASS: $fixture"
              status=1
            fi
          done
          exit $status

  # A schema change only reaches its consumers once divejson.org serves it: every
  # schema's $id resolves there, so the site is the distribution channel rather
  # than a copy of one. This asks the site to rebuild as soon as the schema is
  # known good.
  #
  # `needs: conformance` is the whole point of triggering from here rather than
  # on push. The URL this publishes to is the one validators fetch, so a schema
  # that has not passed its own fixtures must never reach it.
  #
  # The site's weekly cron stays as the fallback for when this does not fire -
  # a revoked or uninstalled App fails silently, and without the cron the site
  # would simply stop tracking the spec with nothing to say so.
  trigger-site-deploy:
    needs: conformance
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      # A job-level `if` cannot read the secrets context, so the guard lives on
      # the steps instead: this job is inert until the App credentials exist,
      # which keeps it safe to merge before the App is created.
      APP_ID: ${{ secrets.SITE_DEPLOY_APP_ID }}
    steps:
      - if: env.APP_ID == ''
        run: echo "::notice::SITE_DEPLOY_APP_ID unset; skipping the divejson.org rebuild"
      - if: env.APP_ID != ''
        id: token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.SITE_DEPLOY_APP_ID }}
          private-key: ${{ secrets.SITE_DEPLOY_PRIVATE_KEY }}
          owner: divejson
          repositories: divejson.org
      - if: env.APP_ID != ''
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: gh workflow run deploy.yml --repo divejson/divejson.org --ref main
